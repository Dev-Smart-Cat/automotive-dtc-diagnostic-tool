# names the workflow, and this name will appear on GitHub Actions
name: Build and Push Docker Image

# this workflow will execute when the changes are merged (pushed) to main brach
on:
  push:
    branches:
      - main

jobs:
    # ubuntu is where the GitHub VM execute this workflow  
    build-and-push:
      runs-on: ubuntu-latest

      steps:
        # Downloads the application's source code onto GitHub VM
        - name: Checkout code
          uses: actions/checkout@v4
        
        # GitHub VM log in to Docker Hub using Docker Hub 
        # user name and password added to GitHub secrets 
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        
        # build the automotive diagnostic tool and push to Docker Hub
        # the projects image/container and name it as weversonbarbieri/automotive-diagnostic-tool 
        - name: Build and push
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/automotive-diagnostic-tool:latest